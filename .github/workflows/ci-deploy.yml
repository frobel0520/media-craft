name: CI and Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust with wasm32 target and clippy
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add clippy
          rustc --version
          cargo --version

      - name: Run Rust Clippy and workspace unit tests
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build Rust WASM core
        run: |
          cargo build -p media-wasm --target wasm32-unknown-unknown --release
          mkdir -p web/public/wasm
          cp target/wasm32-unknown-unknown/release/media_wasm.wasm web/public/wasm/media_wasm.wasm
          ls -lh web/public/wasm/media_wasm.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and audit web dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Typecheck and build web bundle
        working-directory: web
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Verify Cloudflare Pages _headers, WASM artifact, and Harbor middleware
        run: |
          test -f web/dist/_headers
          test -f web/dist/wasm/media_wasm.wasm
          test -f functions/_middleware.js

      - name: Upload dist artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: media-craft-dist
          path: web/dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Require owner and main
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: media-craft-dist
          path: web/dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          npx --yes wrangler@4 pages project create media-craft --production-branch=main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy web/dist --project-name=media-craft --branch=main
