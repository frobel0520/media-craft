<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#1E293B"/>
