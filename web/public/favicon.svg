  <!-- 6 Prismatic Aperture Blades -->
  <path d="M32 12.5L40.2 26.8L29.5 23.8L32 12.5Z" fill="url(#b1)"/>
  <path d="M48.9 22.25L35.4 29.8L39.8 20.1L48.9 22.25Z" fill="url(#b2)"/>
  <path d="M48.9 41.75L34.5 34.4L44.2 33.4L48.9 41.75Z" fill="url(#b3)"/>
  <path d="M32 51.5L23.8 37.2L34.5 40.2L32 51.5Z" fill="url(#b4)"/>
  <path d="M15.1 41.75L28.6 34.2L24.2 43.9L15.1 41.75Z" fill="url(#b5)"/>
  <path d="M15.1 22.25L29.5 29.6L19.8 30.6L15.1 22.25Z" fill="url(#b6)"/>

  <!-- Precision Aperture Blade Lines -->
  <path d="M32 12.5L39.6 26.6M48.9 22.25L33.4 26.6M48.9 41.75L39.6 32M32 51.5L24.4 37.4M15.1 41.75L30.6 37.4M15.1 22.25L24.4 32" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="1.6" stroke-linecap="round"/>

